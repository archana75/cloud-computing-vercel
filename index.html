<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Website praktikum Cloud Computing yang di-deploy menggunakan Vercel.">
  <title>Vercel Web Test | Cloud Computing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      color: #f5f5f5;
      background:
        radial-gradient(circle at 15% 15%, rgba(0, 112, 243, .30), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(124, 58, 237, .25), transparent 32%),
        #08090d;
    }
    .card {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(20, 22, 30, .88);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      color: #c8d7f0;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .logo {
      display: inline-block;
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 20px solid white;
    }
    h1 {
      margin: 25px 0 12px;
      font-size: clamp(34px, 7vw, 56px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    h1 span { color: #8abaff; }
    .intro {
      max-width: 510px;
      margin: 0 auto;
      color: #a9b1c2;
      font-size: 16px;
      line-height: 1.7;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 28px 0 18px;
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(34, 197, 94, .10);
      color: #86efac;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 12px #4ade80;
    }
    .clock {
      margin: 4px 0 24px;
      color: #dce5f5;
      font-size: 14px;
      line-height: 1.7;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 22px;
      background: #fff;
      color: #101116;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); background: #dceaff; }
    .note {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.10);
      color: #778196;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="logo" aria-hidden="true"></span> Cloud Computing Praktikum</div>
    <h1>Web Test on <span>Vercel</span></h1>
    <p class="intro">
      Website statis ini menjadi demonstrasi deployment aplikasi web ke cloud
      menggunakan Vercel yang terhubung dengan repository GitHub.
    </p>
    <div class="status"><span class="dot"></span> Website berhasil dimuat</div>
    <p class="clock" id="time">Memuat waktu...</p>
    <button type="button" onclick="showMessage()">Uji Interaksi</button>
    <div class="note">Static Web Application · HTML · CSS · JavaScript · Vercel</div>
  </main>

  <script>
    function showMessage() {
      alert("Berhasil! JavaScript pada website Vercel berjalan dengan baik.");
    }

    function updateTime() {
      const now = new Date();
      document.getElementById("time").textContent =
        "Waktu perangkat: " + now.toLocaleString("id-ID");
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
